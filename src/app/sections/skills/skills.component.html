<app-section id="skills" title="Skills" 
  ><div class="row g-4">
    @for (g of skills; track g.group) {
      <div class="col-md-6 col-lg-4">
        <h3 class="h6 mb-2">{{ g.group }}</h3>
        <div class="d-flex flex-wrap gap-2">
          @for (i of g.items; track i) {
            <span class="pill">{{ i }}</span>
          }
        </div>
      </div>
    }
  </div></app-section
>
