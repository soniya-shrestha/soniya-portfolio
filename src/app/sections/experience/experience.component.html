<app-section id="experience" title="Experience & education" 
  ><div class="row g-5">
    <div class="col-md-6">
      <h3 class="h4 mb-3">Internship</h3>
      @for (e of exp; track e.title) {
        <app-timeline-item [entry]="e" />
      }
    </div>
    <div class="col-md-6">
      <h3 class="h4 mb-3">Education</h3>
      @for (e of edu; track e.title) {
        <app-timeline-item [entry]="e" />
      }
    </div></div
></app-section>
